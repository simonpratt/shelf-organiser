openapi: 3.0.3
info:
  title: Shelf Organiser
  version: 1.0.0
  description: |
    Items stored in a shed or back room, each with a volume, and nested tags
    to group them. A tag's path is its names from the top-level tag down,
    e.g. ["Location", "Shed", "Shelf 2"].
paths:
  /api/items:
    get:
      operationId: listItems
      summary: List every item, largest total space first
      responses:
        "200":
          description: All items
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Item" }
    post:
      operationId: createItem
      summary: Add an item, creating any tags in its tag paths that are missing
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ItemInput" }
      responses:
        "201":
          description: The new item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/items/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getItem
      responses:
        "200":
          description: The item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: updateItem
      summary: Replace an item, including its whole set of tags
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ItemInput" }
      responses:
        "200":
          description: The updated item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteItem
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/tags:
    get:
      operationId: listTags
      summary: List every tag, sorted by path
      responses:
        "200":
          description: All tags
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Tag" }
    post:
      operationId: ensureTag
      summary: Return the tag at a path, creating it and any missing ancestors
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path: { $ref: "#/components/schemas/TagPath" }
      responses:
        "200":
          description: The tag at the end of the path
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tag" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/tags/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    put:
      operationId: updateTag
      summary: Rename a tag and/or move it under another parent (null for top level)
      description: >
        When a sibling there already has the name, the answer is 409 unless
        merge is true. Then the tag is merged into that sibling in one
        transaction: its items get the sibling instead, its child tags move
        under it (merging any with the same name), the tag is deleted, and
        the sibling comes back.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, parentId]
              properties:
                name: { type: string }
                parentId:
                  type: integer
                  format: int64
                  nullable: true
                merge:
                  description: Merge into a sibling that already has the name instead of answering 409
                  type: boolean
      responses:
        "200":
          description: The updated tag, or the one it was merged into
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tag" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: A sibling already has that name and merge wasn't asked for
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      operationId: deleteTag
      summary: Delete a tag and all its descendants; items keep existing but lose those tags
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/items/tags:
    post:
      operationId: addItemTags
      summary: Add tags to several items in one transaction, keeping the tags they have
      description: Missing tags are created. An unknown item or invalid path changes nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assignments]
              properties:
                assignments:
                  type: array
                  items:
                    type: object
                    required: [itemId, tags]
                    properties:
                      itemId: { type: integer, format: int64 }
                      tags:
                        type: array
                        items: { $ref: "#/components/schemas/TagPath" }
      responses:
        "204": { description: Added }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/tag-proposals:
    post:
      operationId: proposeTags
      summary: Ask Claude for up to three proposed tags in the Type dimension for one item, saved or not
      description: Nothing is saved. No tags come back when the item already has one in the Type dimension.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                note: { type: string }
                tags:
                  description: The tags the item has so far
                  type: array
                  items: { $ref: "#/components/schemas/TagPath" }
      responses:
        "200":
          description: The proposed tags, best first
          content:
            application/json:
              schema:
                type: object
                required: [dimension, tags]
                properties:
                  dimension: { type: string }
                  tags:
                    type: array
                    items: { $ref: "#/components/schemas/ProposedTag" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "502":
          description: Claude couldn't be reached or gave no usable answer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: Claude isn't set up (no Anthropic API key)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/organise:
    post:
      operationId: organise
      summary: Ask Claude for one proposed tag in the Type dimension for each item without one, biggest first, at most 40
      description: Nothing is saved; the client applies the accepted proposals with addItemTags.
      responses:
        "200":
          description: The proposals
          content:
            application/json:
              schema:
                type: object
                required: [dimension, proposals, remaining]
                properties:
                  dimension:
                    description: The top-level tag taken as the Type dimension; may not exist yet
                    type: string
                  proposals:
                    type: array
                    items:
                      type: object
                      required: [itemId, tags]
                      properties:
                        itemId: { type: integer, format: int64 }
                        tags:
                          type: array
                          items: { $ref: "#/components/schemas/ProposedTag" }
                  remaining:
                    description: Other items that still have no tag in the dimension
                    type: integer
        "502":
          description: Claude couldn't be reached or gave no usable answer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: Claude isn't set up (no Anthropic API key)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/claude:
    get:
      operationId: getClaude
      summary: Whether Claude features (dictation, tag proposals) are available, i.e. an Anthropic API key is configured
      responses:
        "200":
          description: Claude status
          content:
            application/json:
              schema:
                type: object
                required: [enabled]
                properties:
                  enabled: { type: boolean }
  /api/dictation/drafts:
    post:
      operationId: draftItems
      summary: Read item drafts out of a dictated transcript, for review before saving
      description: |
        Claude reads the transcript and suggests existing tags only. Nothing
        is saved; the client saves each reviewed draft with createItem.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [transcript]
              properties:
                transcript:
                  type: string
                  description: What was dictated, at most 4000 characters
      responses:
        "200":
          description: The drafts, in the order they were dictated
          content:
            application/json:
              schema:
                type: object
                required: [drafts]
                properties:
                  drafts:
                    type: array
                    items: { $ref: "#/components/schemas/Draft" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "502":
          description: Claude couldn't be reached or gave no usable answer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: Dictation isn't set up (no Anthropic API key)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
components:
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
  responses:
    BadRequest:
      description: The input is invalid
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: No such record
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
    TagPath:
      description: Tag names from the top-level tag down
      type: array
      minItems: 1
      items: { type: string }
      example: ["Type", "Camping", "Tents"]
    Tag:
      type: object
      required: [id, name, parentId, path, itemCount, totalSpace]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        parentId:
          type: integer
          format: int64
          nullable: true
        path: { $ref: "#/components/schemas/TagPath" }
        itemCount:
          description: Items tagged with this tag or any tag inside it, each counted once
          type: integer
        totalSpace:
          description: Total space, in litres, of the items counted in itemCount
          type: number
          format: double
    TagRef:
      type: object
      required: [id, path]
      properties:
        id: { type: integer, format: int64 }
        path: { $ref: "#/components/schemas/TagPath" }
    Item:
      type: object
      required: [id, name, litres, quantity, note, tags]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        litres:
          description: Volume of one unit, in litres. Total space is litres × quantity.
          type: number
          format: double
        quantity: { type: integer }
        note:
          description: Empty when there is no note
          type: string
        tags:
          type: array
          items: { $ref: "#/components/schemas/TagRef" }
    ItemInput:
      type: object
      required: [name, litres]
      properties:
        name: { type: string }
        litres:
          type: number
          format: double
        quantity:
          description: Defaults to 1
          type: integer
        note: { type: string }
        tags:
          description: Tag paths; any missing tags (and ancestors) are created
          type: array
          items: { $ref: "#/components/schemas/TagPath" }
    ProposedTag:
      description: A tag Claude proposes for an item; isNew when it doesn't exist yet
      type: object
      required: [path, isNew]
      properties:
        path: { $ref: "#/components/schemas/TagPath" }
        isNew: { type: boolean }
    Draft:
      description: A proposed item read from a dictation, not yet saved
      type: object
      required: [name, quantity, litres, tags]
      properties:
        name: { type: string }
        quantity: { type: integer }
        litres:
          description: Estimated volume of one unit; null when Claude gave no usable estimate
          type: number
          format: double
          nullable: true
        tags:
          description: Existing tag paths only
          type: array
          items: { $ref: "#/components/schemas/TagPath" }
