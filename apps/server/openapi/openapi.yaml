openapi: 3.0.3
info:
  title: Shelf Organiser
  version: 1.0.0
  description: |
    Items stored in a shed or back room, each with a volume, and nested tags
    to group them. A tag's path is its names from the top-level tag down,
    e.g. ["Location", "Shed", "Shelf 2"].
paths:
  /api/items:
    get:
      operationId: listItems
      summary: List every item, largest total space first
      responses:
        "200":
          description: All items
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Item" }
    post:
      operationId: createItem
      summary: Add an item, creating any tags in its tag paths that are missing
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ItemInput" }
      responses:
        "201":
          description: The new item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/items/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getItem
      responses:
        "200":
          description: The item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: updateItem
      summary: Replace an item, including its whole set of tags
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ItemInput" }
      responses:
        "200":
          description: The updated item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteItem
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/tags:
    get:
      operationId: listTags
      summary: List every tag, sorted by path
      responses:
        "200":
          description: All tags
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Tag" }
    post:
      operationId: ensureTag
      summary: Return the tag at a path, creating it and any missing ancestors
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path: { $ref: "#/components/schemas/TagPath" }
      responses:
        "200":
          description: The tag at the end of the path
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tag" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/tags/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    put:
      operationId: updateTag
      summary: Rename a tag and/or move it under another parent (null for top level)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, parentId]
              properties:
                name: { type: string }
                parentId:
                  type: integer
                  format: int64
                  nullable: true
      responses:
        "200":
          description: The updated tag
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tag" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: A sibling already has that name
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      operationId: deleteTag
      summary: Delete a tag and all its descendants; items keep existing but lose those tags
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }
components:
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
  responses:
    BadRequest:
      description: The input is invalid
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: No such record
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
    TagPath:
      description: Tag names from the top-level tag down
      type: array
      minItems: 1
      items: { type: string }
      example: ["Type", "Camping", "Tents"]
    Tag:
      type: object
      required: [id, name, parentId, path, itemCount, totalSpace]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        parentId:
          type: integer
          format: int64
          nullable: true
        path: { $ref: "#/components/schemas/TagPath" }
        itemCount:
          description: Items tagged with this tag or any tag inside it, each counted once
          type: integer
        totalSpace:
          description: Total space, in litres, of the items counted in itemCount
          type: number
          format: double
    TagRef:
      type: object
      required: [id, path]
      properties:
        id: { type: integer, format: int64 }
        path: { $ref: "#/components/schemas/TagPath" }
    Item:
      type: object
      required: [id, name, litres, quantity, note, tags]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        litres:
          description: Volume of one unit, in litres. Total space is litres × quantity.
          type: number
          format: double
        quantity: { type: integer }
        note:
          description: Empty when there is no note
          type: string
        tags:
          type: array
          items: { $ref: "#/components/schemas/TagRef" }
    ItemInput:
      type: object
      required: [name, litres]
      properties:
        name: { type: string }
        litres:
          type: number
          format: double
        quantity:
          description: Defaults to 1
          type: integer
        note: { type: string }
        tags:
          description: Tag paths; any missing tags (and ancestors) are created
          type: array
          items: { $ref: "#/components/schemas/TagPath" }
